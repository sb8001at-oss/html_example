<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ケース8: 動的生成コンテンツ（条件判断）</title>
</head>
<body>
    <h1>8 条件判断（Control structures）</h1>
    <div id="dynamic-data">評価結果を判定中...</div>

    <script>
        setTimeout(() => {
            const container = document.getElementById('dynamic-data');
            container.innerHTML = `
                <ul>
                    <li>if文条件: <span class="up">x &gt; 0 のとき真を実行</span></li>
                    <li>else文条件: <span class="down">それ以外の場合の処理</span></li>
                </ul>
            `;
        }, 2000);
    </script>
</body>
</html>
