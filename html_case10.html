<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ケース10: メタデータと構造化データ</title>
    <meta name="description" content="このページはWebスクレイピングの練習用に作成されたメタデータのテスト用ページです。">
    <meta property="og:title" content="スクレイピングマスターへの道">
    <meta property="og:image" content="https://example.com/ogp.jpg">
    
    <!-- JSON-LD (構造化データ) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Pythonスクレイピング講座",
      "description": "初心者から実践までをカバーする講座です。"
    }
    </script>
</head>
<body>
    <h1>ヘッドタグを確認してください</h1>
    <p>このページの重要な情報は、画面上ではなくHTMLのソース（head内）に隠されています。</p>
</body>
</html>
