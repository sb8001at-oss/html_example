<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ケース7: ログイン画面（型・クラスの確認と変換）</title>
</head>
<body>
    <div class="login-container">
        <h2>7 型の確認とデータ変換</h2>
        <form action="/check-type" method="POST">
            <div class="form-group">
                <label for="user">対象オブジェクト:</label>
                <input type="text" id="user" name="username" placeholder="my_vector">
            </div>
            <div class="form-group">
                <label for="pass">変換クラス指定:</label>
                <input type="text" id="pass" name="password" placeholder="as.character">
            </div>
            <input type="hidden" name="csrf_token" value="class_check_xyz">
            <button type="submit">型を判定・変換する</button>
        </form>
    </div>
</body>
</html>
