<!DOCTYPE html>
<html lang="ja">
<head><title>ケース9: 不規則なHTML</title></head>
<body>
    <h1> 乱雑な   データ </h1>
    
    <!-- 閉じタグが抜けていたり、大文字小文字が混ざっている -->
    <DIV class="data-box">
        <p>データ1: 正常な値
        <p>データ2: <b>太字だけ閉じてない
    </DIV>
    
    <div class="info__text--large_version2">
        クラス名が複雑なパターン：対象テキスト
    </div>
    
    <!-- 改行だらけのテキスト -->
    <span id="target">
        
        ここのテキストが
        
        欲しい
        
    </span>
</body>
</html>
